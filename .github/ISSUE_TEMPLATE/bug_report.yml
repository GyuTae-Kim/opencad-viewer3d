name: 버그 신고 (Bug report)
description: 뷰어 코어가 안내와 다르게 그리거나 동작할 때 (The viewer core draws or behaves unexpectedly)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        한국어나 영어로 쓰시면 됩니다. STEP·SKP·NC 파일을 잘못 읽는 문제는 각 앱 저장소(opencad-step·opencad-skp·opencad-nc)에 올려 주십시오.
        (Korean or English is fine. File-parsing bugs belong in each app repository.)
  - type: input
    id: version
    attributes:
      label: 판 (Version)
      description: package.json의 version이나 앱이 고정한 커밋 (package.json version or the commit an app pins)
      placeholder: 0.81.0
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: 쓰는 곳 (Used from)
      options:
        - OpenCAD STEP
        - OpenCAD SKP
        - OpenCAD NC
        - 직접 쓰는 코드 (own code)
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요 (What happened)
      description: 기대한 것과 실제로 일어난 것 (expected vs. actual)
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법 (How to reproduce)
      description: 장면을 만드는 코드, dev/viewer3d.html 주소 인자, 누른 단추 (scene code, dev page URL parameters, buttons)
      render: ts
  - type: input
    id: browser
    attributes:
      label: 브라우저와 GPU (Browser and GPU)
      placeholder: Chrome 131 / Windows 11 / NVIDIA RTX 3060
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: 콘솔 오류 (Console errors)
      render: text
