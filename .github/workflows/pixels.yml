name: Pixels

# PR이 그림(화소)이나 고르기·측정 값을 바꾸는지 같은 러너에서 base와 비교한다.
# 저장해 둔 기준 그림은 쓰지 않는다(러너마다 GPU 흉내가 달라서) — base 커밋과 PR을 이 러너에서 둘 다 찍는다.
# 다르면 차이 PNG를 artifact(pixels)로 올리고 실패한다. 의도한 변화면 PR에 'pixels-changed' 라벨을 붙인다(알리기만 하고 통과).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'src/**'
      - 'scripts/pixels/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/pixels.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pixels:
    # 라벨을 붙이거나 떼면 다시 찍어 판정한다. 다른 라벨일 때 작업을 건너뛰면(skipped) PR 화면에서
    # 앞의 실패가 가려지므로 건너뛰지 않는다
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # PR이면 GitHub가 만든 병합 커밋을 받는다: 첫 부모(HEAD^1) = PR이 들어갈 base, HEAD = 병합 결과
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chrome
        run: google-chrome --version
      - name: 화소·값 비교(base = HEAD^1)
        id: pixels
        timeout-minutes: 10
        run: |
          base=$(git rev-parse HEAD^1)
          set +e
          npm run pixels -- --base "$base" --out .runtime/pixels/ci
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 = 같음, 1 = 다름(아래에서 라벨로 판정), 2 = 도구 오류·head 장면 예외(라벨과 상관없이 실패)
          if [ "$code" -ge 2 ]; then exit "$code"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixels
          overwrite: true
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .runtime/pixels/ci/summary.json
            .runtime/pixels/ci/summary.md
            .runtime/pixels/ci/diff/
            .runtime/pixels/ci/unstable/
      - name: 판정
        env:
          CODE: ${{ steps.pixels.outputs.code }}
          CHANGED_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'pixels-changed') }}
        run: |
          if [ "$CODE" = 0 ]; then
            echo "그림과 고르기·측정 값이 base와 같습니다."
          elif [ "$CHANGED_LABEL" = true ]; then
            echo "::notice title=화소·값 변화(pixels-changed)::base와 다른 장면·값이 있지만 PR에 pixels-changed 라벨이 있어 통과합니다. 작업 요약과 artifact 'pixels'에서 차이를 확인하세요."
          else
            echo "::error title=화소·값 회귀::base와 다른 장면·값이 있습니다. 작업 요약과 artifact 'pixels'(base·head·차이 PNG)를 확인하고, 의도한 변화면 PR에 pixels-changed 라벨을 붙이세요."
            exit 1
          fi
